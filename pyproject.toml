[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linuninstall"
version = "1.0.0"
description = "A comprehensive Linux app uninstaller that removes apps AND their leftover cache, config, and temp files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Uninstaller Project" }]
keywords = ["uninstaller", "linux", "cleanup", "package-manager", "cache"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
uninstaller = "uninstaller.cli:main"

[project.gui-scripts]
uninstaller-gui = "uninstaller.gui:run_gui"

[project.optional-dependencies]
dev = ["flake8", "black"]

[tool.setuptools.packages.find]
where = ["."]
include = ["uninstaller*"]
